version: "3.9"

services:
  mahjong-analyzer:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mahjong-analyzer
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # Mortalモデルが揃ったら以下を追加
      # - MORTAL_MODEL_PATH=/app/models/mortal.pt
    volumes:
      # 開発中はホットリロードのためにマウント
      - ./server:/app
      # Mortalモデル配置用（揃ったらコメントアウトを外す）
      # - ./models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
